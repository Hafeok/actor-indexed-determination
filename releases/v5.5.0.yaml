summary: |
  Two areas land: the **ground** area, which names what a determination stands on,
  and the **delivery** area, which names what leaves the act. Both were carried
  through four review gates, with rulings applied between passes.

  ### Added
  - `core/13-delivery.md` — the delivery area.
  - `core/claims/DDD-ground-01..04` — the ground claims, including retro-filing's
    two fields (`DDD-ground-04`).
  - `core/claims/DDD-delivery-01..03` — the delivery claims.
  - `core/decisions/DDD-dec-17.yaml` — the decision filed across the gate passes,
    extended by the GATE 4 rulings.
  - Three delivery terms in the canonical registry.

  ### Changed
  - `core/00-primitives.md`, `core/06-composition.md` — scope extensions from the
    GATE 3 rulings.
  - `core/09-the-measure.md` — Related work inserted as §8, remainder renumbered;
    "judgement" conformed to the paper's "judgment".
  - A term-collision repair across the registry.

  ### Note
  The gate passes are visible in the history as draft-then-ruling pairs: each F-n
  draft was filed pending a ruling, and the ruling commit applied it. The drafts
  are kept rather than squashed — they are the record of what was proposed versus
  what was ratified.
