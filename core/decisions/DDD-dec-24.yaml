format: 1
id: DDD-dec-24
kind: decision
statement: |
  Wave 3 files the principle layer's central material: the indexed-determination core given its canon home (core/14, with the flag clearances that home licenses), the discharge chain (the determinable, the determinate's two registers, supply-mode exhaustiveness, act-indexed discharge, constitutive priority of ground), and the hypothesis set as a new claim area — six derivation-grade claims, five statement-grade hypotheses, three settled terms, one new core document, filed by supersession-and-amendment with every divergence from source material reported rather than harmonised.
principal: Emil
made: 2026-08-18, Wave 3 session (interactive canon curation, ruling at every gate; five gates held)
resolution: |
  What filed, and under which evidence discipline.

  The derivation-grade chain (each claim's derivation check is its evidence, premises by ID,
  steps stated in its notes; all projected):

  - DDD-frame-13 — the determinable as demand's object, the determinate as its product, demand
    as a measure over unresolved determinables. Terms term:determinable and term:determinate
    enter with it, established by 00 (§4a).
  - DDD-frame-14 — the determinate's two registers: outcome (world-landed, always) and verdict
    (predicate-assessed, governed only); every diachronic instrument runs on verdicts. Term
    term:outcome enters with it, established by 09 (§7a).
  - DDD-frame-15 — supply-mode exhaustiveness: demand is never unmet, only ungoverned. The
    seam guard is load-bearing and passed verbatim: the four supply modes partition discharge,
    not governance-supply; the store partition ({rule, check, actor, nothing}) is untouched
    and there is still no fifth source.
  - DDD-frame-16 — discharge is act-indexed; no act-free discharge.
  - DDD-ground-05 — constitutive priority of ground, with the symmetry stated (ground prior in
    each act; decisions prior in a registry's growth) so the bootstrap is not circular.
  - DDD-floor-02 — the relational floor: irreducibility as a property of the indexed relation
    (DDD-frame-01's tuple), with canon's three partial indexings each recovered by holding the
    remaining coordinates fixed. The one new claim the Batch W survey licensed.

  The statement-grade set (predictions, projected on falsifier strength, evidence debt named —
  the preregistered arrangement study, unrun; evidence fields empty by discipline):

  - DDD-hyp-01 through DDD-hyp-05, a new "hyp" area — honest typing for a genuinely distinct
    kind, per the area-minting precedent. Owner paper-4: the arrangement study pays the debt;
    a paper projection carries them as predictions with unrun falsifiers, never as findings.
    The open-predicate validity qualification is restated in hyp-04 and hyp-05's bodies with
    DDD-cost-13 cited; identity persistence held constant is that qualification converted into
    methodology.

  The home. core/14-indexed-determination.md is established minimal (the 13-delivery pattern:
  establish, point, let the claims carry weight), with establishes: [] — the tuple is a claim,
  not a term. It is the exposition home for DDD-frame-01, DDD-frame-02, DDD-floor-02, and the
  hypothesis set.

  The clearances, licensed by that home. Four UNVERIFIED flags carried since v4.4/v4.5 said the
  same thing — the claim's content was not stated in any core document. core/14 is the
  statement, and the flags clear with their factual content preserved as provenance in each
  claim's notes: cleared is not erased. DDD-frame-01 (statement untouched); DDD-frame-02
  (residual-discretion clause added by amendment; prior statement quoted); DDD-frame-03 (the
  seed's "conflated them" softened to the historical claim canon makes, prior statement
  quoted); DDD-frame-07 (amended only to cite the five hypothesis IDs its statement always
  named).

  The terms settle at acceptance. term:determinable, term:determinate, term:outcome enter
  settled: the acceptance of this filing is the ratification act, as with the prior session's
  registry flips.

  The linter baseline moves and the move is accepted. term:outcome adds seven W1 advisories —
  documents 00 through 07 use the word the registry now owns. Accepted as honest forward
  pointers, no suppression and no rename; each document's uses gain their pointers when that
  document is next touched, not in a sweep.

  Divergences from source material, reported not harmonised (canon at head governs):

  - The revision foundation's §4.1 resolution-source table does not map 1:1 onto
    DDD-frame-15's four modes; the claim splits its third source along the arrangement-control
    line and absorbs its fourth into the draw. Recorded in the claim's notes as the projection
    gap the manuscript closes by projecting the claim.
  - The foundation's §8 commentary on selection-versus-training ("closure does not make
    training available or unavailable as a hard gate") contradicts the letter of settled
    term:training. hyp-05 is drafted to need no ruling on that sentence; whether "decides
    availability" softens to a gradient is a supersession question against a settled term,
    deliberately unbundled and flagged to the successor queue.
  - One restated ruling inside DDD-frame-15's derivation carries its provenance (an unratified
    holding note's correction, Emil-ruled 2026-08-13) and a wording correction under the new
    registers (what an ungoverned act draws is an outcome, not a verdict); the step becomes
    citable by reference when its source ratifies.
