notes: |
  DRAFT-PENDING-RULING (GATE 5). Filed at the sweep; the acceptance of the session's filing is
  the ratification act for the term settlements this decision records.

  The compact form entering canon with DDD-frame-15 and DDD-frame-16 — demand is never unmet,
  only ungoverned — entered under the standing bar: a derivation scrutinised to convince someone
  who wanted it to fail, with the seam guard as the sentence that keeps it from contradicting
  term:store.
