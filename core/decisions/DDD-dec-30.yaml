notes: |
  Supersession, never rewriting, for ratified text — the DDD-dec-09 / DDD-dec-10 / DDD-dec-15
  precedent. DDD-frame-15 is retired and kept in the graph with its ratified statement preserved
  verbatim in its notes and its Wave 3 derivation retained beneath, so the retirement does not
  destroy the record it corrects.

  DDD-frame-02 is amended rather than superseded, following that node's own Wave 3 precedent —
  the GATE 1 ruling there was "amend, not companion claim", and the prior statement was quoted in
  its notes rather than filed as a separate node. The choice is flagged at GATE 2 for ruling
  rather than assumed, because the two repairs in this decision take different shapes and the
  asymmetry should be deliberate: DDD-frame-15's defect is in what its statement enumerates, so
  the statement dies; DDD-frame-02's is in two words of a clause whose first half is untouched.

  The occasion for both repairs is the Paper A external review, filed with this session's record
  at meta/sessions/2026-08-23-phase1a/ in the projection repository. Canon at head governs; the
  review is cited as the occasion and never as authority, and no field in any node drafted here
  cites it as evidence.
