notes: |
  DRAFT pending session close. The retro-filing filing (DDD-ground-04) and the axis-registry
  seed artefact are GATE 4; the basis-impact sweep, reference closure, and the downstream pin
  staging are GATE 5 and will be recorded here before this decision is final. Spelling ruled at
  GATE 3: canonical term texts take canon's "judgment" (matching term:judgment); claim prose
  keeps the corpus's "judgement" — deliberate, recorded in the session manifest.
