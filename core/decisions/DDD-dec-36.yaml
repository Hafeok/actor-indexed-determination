notes: |
  Filed at the GATE 5 ruling of the pre-transfer session, on the DDD-dec-15 precedent: a ruled
  re-scoping of a claim, with its supersession recorded and its warrant stated, belongs in the
  decision register rather than only in the claim's notes and a session record — a stranger
  reading DDD-frame-08 should reach why it was re-scoped through the graph rather than through
  meta/, and the lineage constraint is a governing decision that outlives the session. The
  claim's notes carry the text; this decision carries the ruling. Full session record:
  the projection repository's meta/sessions/2026-09-02-pre-transfer/gate1-arity.md.
