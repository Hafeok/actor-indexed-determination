notes: |
  The freight item this discharges was filed at the Phase 1a session with DDD-measure-06's two
  defects as its two instances, and was ruled there to be the freight session's instrument rather
  than Phase 1a's. It is taken here because it is the same surface as the status and kind work:
  one registry, one validator, one session.

  The durable half of the original finding, restated because it is what makes the instrument worth
  building rather than tidy: a compound statement makes a node UNDEMOTABLE. DDD-measure-06's two
  limbs carried different warrants under one status, so demoting the node would have demoted the
  sound limb — which is how a defect survives five minor versions in a repository that reviews its
  own canon. Not because nobody saw it, but because the only available correction was worse than
  the defect.

  A note on what the warning counts mean, so a later reader does not treat them as a defect
  inventory: 32 warnings upstream and 6 downstream are candidates, not findings. The 31 rule-1
  candidates in particular include claims that have been read and judged sound — DDD-measure-04 and
  DDD-measure-16 among them — and the check says so in every line it prints.
