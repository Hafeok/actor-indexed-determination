notes: |
  The eight mixed claims, named so the successor adjudication starts from a list rather than a
  re-survey: DDD-cost-01, DDD-cost-09, DDD-cost-12, DDD-cost-20, DDD-cost-25, DDD-frame-11,
  DDD-frame-14, DDD-frame-17.

  DDD-frame-17 is the named first target, and the reason is uncomfortable enough to record
  plainly: it was filed this month, at v5.10.0, as the successor built to cure DDD-frame-15's
  compoundness — and it is already known-compound, at three limbs. That is evidence for the
  sequencing rather than against the claim. A repair authored under a rule the validator does not
  check reproduces the defect it repairs, which is the same argument the freight item makes about
  DDD-measure-06 and is why the two items sit on one surface.

  The sixteen definitions: DDD-cost-05, DDD-cost-30, DDD-delivery-01, DDD-delivery-02,
  DDD-floor-02, DDD-frame-01, DDD-frame-02, DDD-frame-03, DDD-frame-12, DDD-frame-13,
  DDD-frame-16, DDD-ground-02, DDD-ground-03, DDD-ground-05, DDD-measure-15, DDD-measure-17.
  The five assertoric: DDD-cost-08, DDD-cost-11, DDD-cost-13, DDD-cost-22, DDD-delivery-03.

  The per-claim criterion and reason for each of the twenty-nine are filed with the session
  record rather than here, so a disagreement lands on a claim rather than on a total.

  A correction to the triage that raised this, recorded because the triage's own file carries it
  forward: the observation was escalated into a claim that the registry needed a second field
  carrying kind, separate from maturity. There is no such defect. kind has existed since format 1
  and is legal and populated on all eighty-nine claims across both repositories, spanning ten
  kind x status combinations, with no default and no claim needing one. The observation was about
  a projection that renders no kind column, and the schema was never asked.
