format: 1
id: DDD-measure-16
kind: formal
statement: |
  The verdict-entropy construction is available to an arrangement exactly where the task's acceptance predicate closes for that arrangement; availability is a property of the arrangement, not of the task, and it is neither the existence of the verdict function nor the estimability of the ground distribution.
status: established
region: |
  Arrangements, not tasks: closure is closure for an arrangement (term:closure), so availability
  is indexed the same way and the same nominal task can be inside the construction's domain for
  one arrangement and outside it for another.

  Availability is one of three conditions on the construction, and they fail in different ways.
  Collapsing them was the defect this claim is filed to correct, so the other two are stated here
  as region and are not asserted by this claim:

  EXISTENCE. H(V) requires a verdict function, and the verdict function is supplied by the task
  class rather than by the predicate (term:verdict). Where the class assigns no correct output to
  a point of the input space there is no ground truth to have entropy about and H(V) is
  undefined. Closure does not deliver existence: a relation task can have a fully decidable
  acceptance predicate while admitting several acceptable outputs, and no unique output-valued V
  exists until the task supplies a tie-breaker, a canonical form, or a declared selection
  distribution.

  ESTIMABILITY. H(V) is taken with respect to P, the ground distribution (core/09 §2), so P must
  be known well enough to estimate. Where the deployment distribution is unknown, unstable,
  non-stationary, or only partly observable, the demand is well defined and cannot be computed
  (DDD-measure-12). A verdict function alone does not deliver a number.

  Formal decidability is the wrong criterion for any of the three. Any bounded finite domain is
  decidable by lookup, and a decidable checker may demand resources no arrangement has;
  term:closure reserves decidable for the formal special case rather than making it the
  requirement, and the reservation is load-bearing in both directions.

  What lies outside this claim's region is the availability of THIS construction and not
  measurement as such. Where evaluators disagree there are distributions over their judgments;
  where preferences are elicited there are distributions over preferences; where outputs are
  scored there are distributions over scores. Those are measurable and some are informative. The
  framework's governance question — is every governing decision in a declared store, none escaped?
  — is well-formed on the total domain and its domain is strictly wider than the measure's
  (DDD-frame-11).
evidence:
  - kind: derivation
    ref: core/09-the-measure.md §7
    note: >-
      definitional on the measure side, and claimed as no more than that: closure is what
      licenses evaluating the predicate over available ground within declared bounds, and
      availability of the construction to an arrangement is that licence read back. The
      coincidence with core/03's independently derived floor is a separate claim
      (DDD-measure-17) and is not evidence for this one.
falsifier: |
  An arrangement for which the acceptance predicate closes and the verdict function exists, and for which the construction is nevertheless unavailable for a reason that is neither an estimability failure nor a failure of closure; or an arrangement that computes H(V) over a predicate that does not close for it.
breaks: |
  The closing-region bound on conservation loses its statement: term:conservation would hold as a theorem on a region canon could no longer name, and proxy pricing would approximate to nothing exact. DDD-frame-11's wider governance domain is untouched either way.
test: >-
  a task with an open predicate for which a defensible verdict function exists anyway — carried
  forward from DDD-measure-06, where it was the stated test and, being the existence question
  rather than the availability question, is now sharper: such a task falsifies nothing here and
  falsifies the region's existence condition
owner: paper-1
changed: v5.10 (2026-08-23, Phase 1a session)
supersedes: DDD-measure-06
notes: |
  [PROPOSED — drafted at the Phase 1a session's GATE 3, pending Emil's ruling. Nothing here is
  ratified. The banner is struck when the ruling lands.]

  The availability limb of DDD-measure-06, narrowed and separated. The coincidence limb is
  DDD-measure-17. DDD-measure-06 is retired.

  WHY THE SPLIT. DDD-measure-06's statement joined two assertions with a semicolon — "the measure
  exists iff the acceptance predicate operationally closes; H(V) is undefined exactly where the
  framework's floor result locates non-zero floor" — and spec/claim-format.md §2 rule 1 forbids
  it: one proposition per claim, and the unit of status change must be the unit of statement. One
  status governed a near-definitional limb and a substantive one. That is why the node resisted
  repair: demoting it would have demoted the sound half, so nobody demoted it.

  WHY established SURVIVES HERE. Rule 4 holds that an identity that holds is formal and can be
  established. Availability-given-closure is definitional on the measure side — the node's own
  evidence field said as much at v4.5 — and definitional content is establishable. What was not
  defensible at established is the coincidence, and it has moved to a node that carries it at
  projected.

  WHY THE BICONDITIONAL WENT. DDD-measure-06 said iff, and the measure note's companion projection
  concedes both directions. The concession is quoted here from the note as merged, at §8, because
  a canon claim should carry the words that killed its predecessor:

  > A verdict function can exist without being usable. A predicate that assigns a definite verdict
  > to every input, but whose acceptance procedure cannot be executed over available ground within
  > declared resource, latency, and confidence bounds, does not close — and H(V) then exists
  > mathematically while being unavailable in practice. These are two failures, not one.

  and, on the other direction:

  > An open predicate does not abolish measurement. […] What is unavailable outside the scope
  > condition is *this construction* — a deterministic verdict function to take the entropy of —
  > and not measurement as such.

  The external review reached the same boundary independently and adds one mechanism the note
  states less sharply: closure is not sufficient for an output-valued verdict variable, because a
  fully decidable predicate can admit several acceptable outputs and no unique V exists until the
  task supplies a tie-breaker, a canonical form, or a declared selection distribution. That
  sentence is why the existence condition in region names the TASK CLASS as the supplier and not
  the predicate.

  A CORROBORATION WORTH RECORDING. The review reaches this same existence condition twice, from
  two sections, and does not notice that it has. Its §5 lists "unspecified acceptance criteria"
  among candidate species of residual discretion; that is not discretion at all — it is an open
  acceptance predicate, and it is this claim's region's first paragraph. Independent arrival at
  one boundary from two directions is corroboration of the boundary, and is recorded as such
  rather than as a defect in the review.

  A FALSIFIER, WHERE THE PREDECESSOR CARRIED NONE. DDD-measure-06 had no falsifier field at all,
  legally — rule 2 requires one for projected and says nothing for established — and it sat at
  established for five minor versions with no stated observation that would fire against it. Emil
  ruled at GATE 1 that both successors carry falsifiers, including this one: a near-definitional
  claim's falsifier may be thin, but "every claim carries one" has no near-definitional exception,
  and the missing field is precisely how the predecessor escaped scrutiny. The gap in
  validate-claims.py that let it through is filed as a freight item with this node and
  DDD-measure-06's compound statement as its two instances.

  WHAT THIS CLAIM DOES NOT DO. It does not attempt arrangement-relative admissibility — the
  decoder repair, review §3, explicitly out of this session's scope. The narrowing to availability
  TO AN ARRANGEMENT is adjacent to it and stops short deliberately: it relativises the
  construction's availability to an arrangement, which term:closure already does in saying a
  predicate is "closed for an arrangement", and it asserts nothing about which conditioning
  variables are admissible. That question stays open and is research, not filing.
