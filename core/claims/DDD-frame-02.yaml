format: 1
id: DDD-frame-02
kind: conceptual
statement: |
  Behavioural commitments attach at three levels — outcome, policy, principal — which compose and are not actor species; residual discretion is the outcome-relevant variation that remains after the arrangement's declared commitments are applied.
status: projected
region: engineered arrangements
test: >-
  boundary-case coverage; an arrangement whose commitments resist the three-level coding, or
  whose remaining outcome-relevant variation resists description as residual discretion
owner: none
changed: v5.7 (2026-08-18, Wave 3 session — residual-discretion clause added, exposition home gained, flag cleared)
notes: |
  Filed from the Wave 3 session (2026-08-18; interactive curation, Emil ruling at every gate;
  ratified at the GATE 3 ruling).

  Amendment record (GATE 1 ruling: amend, not companion claim; the clause completes the same
  thought and the claim is projected, not ratified). Prior statement, v4.4: "Behavioural
  commitments attach at three levels — outcome, policy, principal — which compose and are not
  actor species." The residual-discretion clause is drafted from the revision foundation's
  §3.5, which additionally relativises it to task distribution, accessible ground, tolerance,
  and time horizon — that relativity is DDD-frame-01's index doing its work and is carried as
  exposition in core/14 §2, not restated in this claim. Residual discretion is deliberately not
  minted as a term this session; the clause is claim content, and minting waits on use.

  [PROPOSED] Mint record, Track 1 session (2026-08-18) — notes only; statement, status, region,
  test, owner, and changed are untouched, and nothing here supersedes anything. The use the Wave
  3 note waited on arrived: the determination learning track needs both "commitment level" and
  "residual discretion" as citable nodes for its rungs 5 and 6. Both are minted as
  term:commitment-level and term:residual-discretion, established by
  core/14-indexed-determination.md §2 — the exposition home this claim already had. The track is
  the trigger for the mint and is not its authority: the canonical text is drawn from §2's
  existing exposition and from this claim's own statement, no new content is asserted by either
  term, and a downstream document is never the proximate cause of an upstream mint. One
  One consequence was raised for ruling and is now ruled (Gate 1, Emil): core/14's contract
  moves from establishes: [] to establishing the two terms, and DDD-dec-24's minimality clause
  is read as tuple-specific — its recorded reason, "the tuple is a claim, not a term", is its
  scope, the tuple is still not minted, and the clause is discharged as written rather than
  overridden. No supersession. The alternative reading, and why it was not taken, is on the
  record in DDD-dec-26.

  Exposition home: core/14-indexed-determination.md §2. The UNVERIFIED flag carried since v4.4
  — the levels appeared only in pre-split scaffolding that did not migrate, "not in any core/
  document" — cleared at the Wave 3 GATE 1/GATE 3 rulings: core/14 is the statement in canon,
  and the clearance is recorded in the session decision.
