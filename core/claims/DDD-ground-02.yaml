format: 1
id: DDD-ground-02
kind: conceptual
statement: |
  Ground relative to a filed decision set takes exactly one of four states — governed (a filed decision covers this region), declared-empty (declared: no outcome-relevant alternative here), open (declared: alternative here, deliberately unresolved, under observation), uncovered-undeclared (none of the above) — and only the fourth is a finding.
status: projected
region: |
  Synchronic — a state of ground relative to a filed decision set, read at an act (upstream per
  DDD-dec-09's charter). The typing classifies ground, not decisions: a single decision may file
  an acceptance whose sub-regions are open underneath it, and the states are read per region.
evidence:
  - kind: observation
    ref: "Corpus test results, 2026-08-14 — rows 4 and 8, and §4 Q1"
    note: |
      The corpus (11 rows: 5 canon-ratified, 4 accepted-not-ratified, 2 pending) exercised open
      twice — DDD-dec-14's first-order question and the What-boundaries acceptance's 24
      underlying determinations — and both times open's distinctive features did real work: an
      owner, a horizon or transfer condition, under-observation. Row 8 shows the typing keeping
      apart what the store partition alone cannot state: accepted exposure realising at an open
      boundary is the arrangement working, not an incident, and not escape.
  - kind: observation
    ref: "Corpus test results, 2026-08-14 — Gate 4 criterion-1 ruling"
    note: |
      11 of 11 rows express fully under this typing (the governing reading, ruled); 9 of 11 plus
      one nameable failure class without it. The gap between the two readings is the typing's
      earned value, ruled at Gate 4.
falsifier: |
  A corpus retrieval miss whose ground state cannot be assigned to exactly one of the four states; or a corpus over which open's distinctive features (owner, horizon or transfer condition, under-observation) do no discriminating work against governed and uncovered-undeclared.
test: |
  Expression over further decision corpora; the 2026-08-14 eleven-row table is the first instance. The declared-empty limb has no instance yet and is the state to watch.
breaks: |
  DDD-ground-03 loses its subject (the open state is what has no resolution to time). The sweep's promised remedy — a retrieval miss resolving to a named state rather than an ambiguity — reverts to advisory.
owner: none
changed: v5.5 (2026-08-15, vocabulary-and-delivery session)
notes: |
  Filed from the vocabulary-and-delivery session (earned 2026-08-14; interactive curation, Emil
  ruling at every gate). Scoped as evidenced, and the scoping is uneven by state: the corpus
  exercised open twice and governed/uncovered throughout, but declared-empty zero times — no
  sampled decision declares "no outcome-relevant alternative here". FLAGGED for the Gate 2
  ruling: whether the declared-empty limb files now (per the applicability note's ruling-2
  answer) or waits; the corpus did not exercise it, and its wording sources to the
  ground-applicability note (2026-08-12, unratified).

  PENDING — Emil review: that applicability note, announced at the Gate 1 ruling (362 lines /
  2,494 words, sha256 4afe380c…), did not arrive; the identity check failed as absent. Two
  elements of this filing rest on it and are carried here as the session prompt's paraphrase
  until the note is received: the declared-empty wording and ruling-2 reference above, and the
  framing of source coverage, resolution, and assurance as orthogonal properties (with open as a
  resolution value carrying a deferred verdict, and the Unknown-is-never-a-pass rule) — the
  orthogonality framing is deliberately kept OUT of the statement for exactly this reason.

  Whether declared-empty and open collapse into one construct with two values is the note's open
  ruling 2, still open: the corpus can only report that open did all the observed work of the
  pair (§4 Q1). Nothing here settles it.
