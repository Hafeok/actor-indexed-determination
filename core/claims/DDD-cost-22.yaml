format: 1
id: DDD-cost-22
kind: conceptual
statement: |
  The claim layer is governed by the same two gates: instrument the claim's predicate toward closure where the horizon permits — declared falsifier, metric, horizon; where it does not close, assurance attaches to the claimant by demonstrated class. Both gates are the act-layer rule applied to deferred-verdict acts; neither adds a new mechanism.
status: projected
region: |
  Claims as deferred-verdict acts (DDD-frame-12); the routing register of DDD-cost-08 applied at the claim layer. The coverage economics of the instrument gate quantify over claim volume and file with the projection.
evidence: []
falsifier: |
  A governable claim covered by neither gate and not disposed by declared risk acceptance — no instrumentable predicate at any horizon and no demonstrable claimant class; or claim-layer assurance demonstrated to require a mechanism the act-layer gates cannot express.
test: |
  Counterexamples against the two-gate exhaustiveness at the claim layer; coding reliability of the gate assignment (instrumentable vs carrier-assured) on real claim inventories.
credits: |
  The gate structure is DDD-cost-08's; the deferral is DDD-frame-12's. Nothing new is claimed beyond their composition.
owner: none
changed: v5.3 (2026-08-10, Wave 2 curation session)
notes: |
  Wave 2 item 2.11, filed on GATE E's confirmation with Emil's addition (2026-08-10): the
  carrier-assurance gate carries the DDD-cost-13 cross-reference — answer-keyed instruments
  cannot certify carriage of deferred-verdict claims (the instrument's predicate closes at
  examination time; the claim's verdict has not arrived) — and the matured-verdict record is
  the instrument class for this gate, pending at queue item 2.12; reference by item, ID on
  2.12's filing. The falsifier was amended and the test ratified verbatim at the pre-Gate-H
  hold (Emil, 2026-08-10); declared risk acceptance is named in the doc's exposition as the
  out-of-scope third disposition — governed, unassured. The escaped-claim reduction falsifier the holding note ships attaches to the
  coverage-economics claim with the projection.
