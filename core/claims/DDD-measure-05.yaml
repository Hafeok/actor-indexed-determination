format: 1
id: DDD-measure-05
kind: empirical
statement: |
  The identification survives an estimated channel: on a simulated RAG task, I(A;R) and H(A|R) estimated from samples sum to H(A) within estimator error across retrieval qualities.
status: reported
region: simulation only; a tractability result, not evidence of conservation
evidence:
- kind: asset
  ref: core/assets/measure-rag.py
  note: >-
    40k samples per row; answer generated independently of what is supplied, so closer to
    construction than measurement — never present as conservation in the wild. The sum column is
    exact by construction (I(A;R) is computed as H(A) - H(A|R)) and tests nothing; what is tested
    is that a plug-in estimator recovers H(A|R) for a channel it is not given in closed form.
    Replicate band, 200 independent replicates at N = 40,000 against the analytic joint: mean
    estimate within 0.002 bits at every setting; single-run standard deviation up to 0.010 bits;
    plug-in H(A) mean 2.6117, sd 0.0049, central 95% range [2.601, 2.621], bias -0.0008;
    population value 2.6126. Every row total falls inside that range. The band characterises the
    estimator and is not printed by the asset - it is reproduced by running the same plug-in
    estimator over 200 samples from the prior and channel the asset stipulates
falsifier: |
  Estimation on a real deployed retrieval system fails to recover the identity within error bars.
owner: paper-1
