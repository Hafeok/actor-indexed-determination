notes: |
  FLAG CLEARED 2026-08-17 (freight session, item D-5). The flag read: core/09 §6.3 presented this
  as "conservation of specification demand, measured on a deployed system pattern rather than a
  toy", which overstated relative to this claim's region — the answer is generated independently
  of what is supplied, by construction, so the run is closer to construction than measurement.
  The claim kept the honest form and the prose was the bug, as the flag said.

  The prose is now repaired rather than the claim relaxed, which is the direction the repository's
  rule requires. core/09 §6.3 is retitled to what the instance actually is — the encode/verify
  split, X = what is supplied before the act, with retrieval as motivation rather than as the
  thing simulated — and the overclaiming sentence is replaced by a statement of what the run tests
  and what it cannot: the sum column is exact by construction and tests nothing, and the result is
  a tractability result, not a measurement of conservation. The claims mapping table row is
  updated to match.

  Region and status unchanged: simulation only, a tractability result, reported. What changed is
  that canon's exposition now says the same thing the claim always did.

  The replicate band was added to the asset evidence note in the same pass (item D-4). It was
  computed for the measure note's revision and had never been carried in canon, which left a
  reported claim's estimator uncharacterised — the numbers say how much of the row-to-row movement
  in the sum column is estimator noise, and the answer is all of it.
