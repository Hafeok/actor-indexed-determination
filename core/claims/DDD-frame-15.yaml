statement: |
  RETIRED — "every completed act's determination demand is discharged by a filed decision, an actor's judgment, an arrangement default, or an uncontrolled draw." The four modes do not partition: a declared default is both a filed decision and an arrangement default, a thermostat satisfies the judgment gloss under a rule canon times as encoded, and trained inference is policy commitment, judgment and standing encoded supply at once. Superseded by DDD-frame-17, which partitions the same object by dichotomy on determination and control.
