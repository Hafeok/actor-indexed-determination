statement: |
  RETIRED — "the measure exists iff the acceptance predicate operationally closes; H(V) is undefined exactly where the framework's floor result locates non-zero floor." The biconditional fails in both directions and the two limbs carry different warrants under one status. Superseded by DDD-measure-16 (availability to an arrangement, with existence and estimability separated) and DDD-measure-17 (the coincidence, at projected).
