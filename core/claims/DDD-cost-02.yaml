id: DDD-cost-02
kind: formal
statement: |
  Degeneracy: a cost model whose standing side is linear in I(V;E) is flat — conservation forces dI = -dR exactly, so every distinction removes precisely as many occasioned bits as it adds standing bits and no distinction can be priced ahead of another; pricing distinctions apart requires standing cost priced as mechanism description length, which is not a conserved quantity.
