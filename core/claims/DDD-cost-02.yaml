  note: >-
    reproduces the degeneracy exactly: all inter-encoding densities 1.000 on the date task;
    description-length pricing then separates the distinctions — bits captured per unit of
    description differ per feature
falsifier: |
  — (identity consequence; fails only with the chain rule)
credits: |
  The identity is Shannon's chain rule; the two-part form is Rissanen's MDL. The degeneracy observation — that conservation makes information-linear standing cost degenerate — is the framework's.
