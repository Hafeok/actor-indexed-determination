id: DDD-cost-03
kind: empirical
statement: |
  MDL correspondence, rate form: description length prices the standing side of determination supply and entropy prices the occasioned side — MDL's L(model) and L(data|model), read as per-act rates.
status: projected
region: |
  closing-predicate region; coefficients stipulated, not measured; correspondence to physical production cost is the projected content
evidence:
- kind: asset
  ref: core/assets/measure-mdl-demo.py
  note: >-
    exercises the rate-split (computable and non-degenerate) and the residual-floor check; does
    not and cannot confirm the correspondence — coefficients stipulated
- kind: observation
  ref: meta/mdl-cost-manufacturing-assessment-2026-08-08.md
  note: >-
    basis, not confirmation: public manufacturing data strongly consistent with the generic
    two-part form but structurally unable to select the MDL form; experience-curve meta-analyses
    are floor-free by construction (a floor term never tested); within-part moulding
    cost-vs-volume data identified as the accessible discriminating test; no prior
    MDL-to-manufacturing-cost application found
falsifier: |
  Occasioned per-act cost driven to zero under a mechanism short of closure — no non-zero occasioned floor.
breaks: |
  DDD-cost-05's per-act denomination of the capacity model's escape term survives — it is not MDL-specific. The volume-optimisation layer that prices these rates across acts (relocated per DDD-dec-09) loses its pricing mechanism.
credits: |
  The two-part code is Rissanen's MDL; the identity beneath it is Shannon's. The identification with determination-supply cost is the framework's.
