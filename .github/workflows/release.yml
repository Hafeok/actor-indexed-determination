name: release

# Cut a release without a computer: Actions -> release -> "Run workflow".
# Works from the GitHub mobile app / phone browser. The runner's GITHUB_TOKEN
# carries `contents: write`, so tag creation does not depend on any local
# credential's ref scope.
#
# Every canon gate in CLAUDE.md runs against the exact commit being tagged,
# BEFORE the tag exists. A release that fails a gate leaves no trace.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v5.5.0'
        required: true
        type: string
      title:
        description: 'Title, e.g. vocabulary and delivery: the ground and delivery areas'
        required: true
        type: string
      commit:
        description: 'Commit to tag (blank = tip of the branch selected above)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — run every gate, create nothing'
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub Release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  # Tagger identity. All tags v5.0.0..v5.4.0 carry this; change it here to change
  # it everywhere. Kept out of the dispatch form to keep that form short on a phone.
  TAGGER_NAME: 'Emil Klein -  Claude Code AI'
  TAGGER_EMAIL: 'emk@delegate.dk'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      # ---- resolve and guard -------------------------------------------------
      # Inputs reach the shell as env vars, never as ${{ }} inside a script body.

      - name: Resolve target commit
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like v5.5.0 (got '$VERSION')"; exit 1 ;;
          esac

          target="${COMMIT:-${{ github.sha }}}"
          if ! sha=$(git rev-parse --verify --quiet "${target}^{commit}"); then
            echo "::error::'$target' is not a commit in this repository"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists — versions are never reused"
            exit 1
          fi

          # Releases come off the default branch. A tag on an unmerged commit
          # would pin canon that main does not carry.
          if ! git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$sha is not an ancestor of origin/$DEFAULT_BRANCH — merge it first"
            exit 1
          fi

          prev=$(git describe --tags --abbrev=0 "$sha" 2>/dev/null || echo "")

          {
            echo "sha=$sha"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"

          echo "Tagging $sha"
          git log -1 --format='  %h %an  %s' "$sha"
          echo "Previous tag: ${prev:-(none)}"

      - name: Check out the commit under release
        run: git checkout --detach ${{ steps.resolve.outputs.sha }}

      # ---- canon gates (CLAUDE.md) ------------------------------------------

      - name: Gate — core ordering + transclusion (exit 0, zero W4)
        run: |
          set -euo pipefail
          out=$(python3 validate-core-order.py core/)
          echo "$out"
          if echo "$out" | grep -q ' W4 '; then
            echo "::error::W4 migration-gap warnings present"
            exit 1
          fi

      - name: Gate — claim schema
        run: python3 scripts/validate-claims.py core/claims/

      - name: Gate — decision schema
        run: python3 scripts/validate-claims.py core/decisions/ --decisions

      - name: Gate — assets reproduce
        run: |
          set -euo pipefail
          # "A claim whose computation fails demotes until fixed" — so a release
          # whose computations fail does not get cut.
          fail=0
          for f in core/assets/*.py; do
            if timeout 300 python3 "$f" >/dev/null 2>&1; then
              echo "  ok    $f"
            else
              echo "  FAIL  $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::an asset failed to reproduce"; exit 1; }

      # ---- notes -------------------------------------------------------------

      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ inputs.version }}
          PREV: ${{ steps.resolve.outputs.prev }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Prefer the hand-written CHANGELOG section; fall back to the commit
          # range so a release is never cut with empty notes.
          python3 - <<'PY' > notes.md
          import os, re, subprocess

          version = os.environ["VERSION"]
          prev, sha = os.environ["PREV"], os.environ["SHA"]
          body = ""

          try:
              with open("CHANGELOG.md", encoding="utf-8") as fh:
                  text = fh.read()
              m = re.search(
                  r"^## +%s\b.*?(?=^## |\Z)" % re.escape(version),
                  text, re.M | re.S,
              )
              if m:
                  body = m.group(0).strip()
          except FileNotFoundError:
              pass

          if not body:
              rng = f"{prev}..{sha}" if prev else sha
              log = subprocess.run(
                  ["git", "log", "--no-merges", "--format=- %s (%h)", rng],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
              body = (
                  f"_No `## {version}` section in CHANGELOG.md; "
                  "notes generated from the commit range._\n\n" + log
              )

          print(body)
          PY

          if [ -n "$PREV" ]; then
            printf '\n\n---\n\n**Full diff:** [%s...%s](%s/compare/%s...%s)\n' \
              "$PREV" "$VERSION" "$REPO_URL" "$PREV" "$VERSION" >> notes.md
          fi

          echo "--- notes.md ---"
          cat notes.md

      # ---- cut ---------------------------------------------------------------

      - name: Dry run — stop here
        if: inputs.dry_run
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "### Dry run — every gate passed, nothing created"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$VERSION\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Message | $VERSION — $TITLE |"
            echo
            echo "Re-run with **Dry run** unchecked to cut it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push the annotated tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "$TAGGER_NAME"
          git config user.email "$TAGGER_EMAIL"
          # Em dash, matching v5.0.0..v5.4.0.
          git tag -a "$VERSION" "$SHA" -m "$VERSION — $TITLE"
          git push origin "refs/tags/$VERSION"

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          args=(--title "$VERSION — $TITLE" --notes-file notes.md --verify-tag)
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "$VERSION" "${args[@]}"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "### Released \`$VERSION\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | [\`$VERSION\`]($REPO_URL/releases/tag/$VERSION) |"
            echo "| Commit | \`$SHA\` |"
            echo "| Message | $VERSION — $TITLE |"
          } >> "$GITHUB_STEP_SUMMARY"
